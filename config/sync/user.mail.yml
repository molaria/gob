langcode: sv
cancel_confirm:
  subject: 'Begäran om avslutande av konto för [user:display-name] på [site:name]'
  body: "[user:display-name]\r\n\r\nEn begäran om att avsluta ditt konto har gjorts på [site:name].\r\n\r\nDu kan nu avsluta ditt konto på [site:url-brief] genom att klicka på den här länken eller kopiera och klistra in den i din webbläsare:\r\n\r\n[user:cancel-url]\r\n\r\nOBS: Uppsägningen av ditt konto kan inte ångras.\r\n\r\nDenna länk upphör om en dag och ingenting kommer att hända om den inte används.\r\n\r\n-- Administratörerna på [site:name]"
password_reset:
  subject: 'Ersättande inloggningsuppgifter för [user:display-name] på [site:name]'
  body: "<p>[user:display-name],</p>\r\n\r\n<p>En begäran om att återställa lösenordet för ditt kontot har gjorts på [site:name].</p>\r\n\r\n<p>Du kan nu logga in genom att klicka på länken eller kopiera och klistra in den i din webbläsare.</p>\r\n\r\n<p>[user:one-time-login-url]</p>\r\n\r\n<p>Denna länk kan bara användas en gång och kommer ta dig till en sida där du kan ange ditt lösenord. Denna länk upphör efter en dag och inget kommer hända om du inte använder den.</p>\r\n\r\n<p>--  Med vänlig hälsning /Mats-Olof</p>"
register_admin_created:
  subject: 'En administratör har skapat ett konto åt dig på [site:name]'
  body: "Hej! [user:display-name],\r\n\r\nNu skapade jag ett konto åt dig på hemsidan till: [site:name]. Du kan nu logga in genom att klicka på länken eller kopiera och klistra in den i din webbläsare.\r\n\r\n[user:one-time-login-url]\r\n\r\nDenna länk kan bara användas en gång och kommer ta dig till en sida där du kan ange ditt lösenord.\r\n\r\nEfter att du angivit ditt lösenord kan du i framtiden logga in på [site:login-url] genom att använda:\r\n\r\nanvändarnamn: [user:name]\r\nlösenord: Ditt lösenord\r\n\r\n--  Med vänlig hälsning /MO"
register_no_approval_required:
  subject: 'Kontouppgifter för [user:display-name] på [site:name]'
  body: "[user:display-name],\r\n\r\nTack för att du har registrerat dig på [site:name]. Du kan nu logga in genom att klicka på denna länk eller genom att klippa ut och klistra in den i din webbläsare:\r\n\r\n[user:one-time-login-url]\r\n\r\nDetta är en engångsinloggning, så den kan bara användas en gång och kommer att leda dig till en sida där du kan välja ett eget lösenord.\r\n\r\nEfter detta kommer du kunna logga in på [site:login-url] med följande uppgifter:\r\n\r\nanvändarnamn: [user:name]\r\nlösenord: Ditt lösenord\r\n\r\n--  Administratörerna på [site:name]"
register_pending_approval:
  subject: 'Kontodetaljer för [user:display-name] på [site:name] (väntar på godkännande av administratör)'
  body: "Hej! [user:display-name],\r\n\r\nTack för att du registrerat dig förr ett konto på hemsidan till [site:name]. Din ansökan väntar nu på godkännande. När den har godkänts kommer du att få ytterligare ett e-post som innehåller information om hur du loggar in, byter lösenord och andra detaljer.\r\n\r\n-- Med vänlig hälsning administratören på [site:name]"
register_pending_approval_admin:
  subject: 'Kontodetaljer för [user:display-name] på [site:name] (väntar på godkännande av administratör)'
  body: "[user:display-name] har ansökt om ett konto.\r\n\r\n[user:edit-url]"
status_activated:
  subject: 'Kontodetaljer för [user:display-name] på [site:name] (godkänd)'
  body: "Hej [user:display-name],\r\n\r\nDitt konto på [site:name] har aktiverats.\r\n\r\nDu kan nu logga in genom att klicka på denna länk eller genom att kopiera den till din webbläsare:\r\n\r\n[user:one-time-login-url]\r\n\r\nDenna länk kan enbart användas en gång och kommer att leda dig till en sida där du kan ange ditt lösenord.\r\n\r\nEfter att du angett ett lösenord kommer du i framtiden att kunna logga in på [site:login-url] genom att använda:\r\n\r\nanvändarnamn: [user:account-name]\r\nlösenord: Ditt lösenord\r\n\r\n-- Med vänlig hälsning /MO"
status_blocked:
  subject: 'Kontouppgifter för [user:display-name] på [site:name] (spärrad)'
  body: "[user:display-name],\r\n\r\nDitt konto på [site:name] har spärrats.\r\n\r\n--  Administratörerna  på [site:name]"
status_canceled:
  subject: 'Kontouppgifter för [user:display-name] på [site:name] (borttagen)'
  body: "[user:display-name],\r\n\r\nDitt konto på [site:name] har tagits bort.\r\n\r\n--  Administratörerna på [site:name]"
