id: alert
label: alert
code: |
  /* =========================================================
     Drupal alerts – placeholder fix + bättre kontrast
     ========================================================= */

  /* Bas för alla Drupal alerts */
  .alert {
    white-space: normal;
    line-height: 1.5;
  }

  /* Neutralisera Bootstrap placeholder FULLSTÄNDIGT i alerts */
  .alert .placeholder,
  .alert em.placeholder {
    /* Typografi – detta är nyckeln för linjering */
    display: inline;
    vertical-align: baseline;
    line-height: inherit;
    font-size: inherit;

    /* Färg – tydlig men inte skrikig */
    color: #0a3622; /* mörk grön */
    background: none;
    opacity: 1;

    /* Ta bort Bootstrap-skeleton-beteende */
    width: auto;
    height: auto;
    animation: none;
  }

  /* Visuell markering av e-post / nyckeldata */
  .alert em.placeholder {
    font-style: normal;
    font-weight: 600;
    padding: 0 0.1em;
  }

  /* Anpassa per alert-typ (valfritt men snyggt) */
  .alert-success em.placehold
