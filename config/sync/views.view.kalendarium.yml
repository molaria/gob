            text: "{% if field_anmalan_mojlig == \"Ja\" %}\r\n\r\n<div class=\"card card-anmalan-custom mb-4 shadow-sm\">\r\n  <div class=\"card-header text-white\">\r\n    Anmälan\r\n  </div>\r\n  <div class=\"card-body\">\r\n\r\n    {% if not flagged and not flagged_1 %}\r\n      <div class=\"d-flex gap-2 flex-wrap\">\r\n        <div class=\"btn btn-color-success flex-fill text-center\">\r\n          {{ link_flag }}\r\n        </div>\r\n        <div class=\"btn btn-color-kan-ej flex-fill text-center\">\r\n          {{ link_flag_1 }}\r\n        </div>\r\n      </div>\r\n\r\n    {% elseif flagged and not flagged_2 %}\r\n      <div class=\"d-flex align-items-center gap-2\">\r\n        <span class=\"fw-bold\">Du är anmäld, om du <em>inte kan komma</em> så ändra genom att klicka här:</span>\r\n        {{ link_flag_2 }}\r\n      </div>\r\n\r\n    {% elseif flagged and flagged_2 %}\r\n      <div class=\"d-flex align-items-center gap-2\">\r\n        <span class=\"fw-bold\">Du kommer inte, om du <em>kan komma</em> så ändra genom att klicka här:</span>\r\n        {{ link_flag_2 }}\r\n      </div>\r\n\r\n    {% elseif flagged_1 and not flagged_3 %}\r\n      <div class=\"d-flex align-items-center gap-2\">\r\n        <span class=\"fw-bold\">Du kommer inte, om du <em>kan komma</em> så ändra genom att klicka här:</span>\r\n        {{ link_flag_3 }}\r\n      </div>\r\n\r\n    {% elseif flagged_1 and flagged_3 %}\r\n      <div class=\"d-flex align-items-center gap-2\">\r\n        <span class=\"fw-bold\">Du är anmäld, om du <em>inte kan komma</em> så ändra genom att klicka här:</span>\r\n        {{ link_flag_3 }}\r\n      </div>\r\n    {% endif %}\r\n\r\n  </div>\r\n</div>\r\n\r\n{% endif %}\r\n"
