code: |
  /* ============================
     Knapp: "Kommer" (grön)
     ============================ */
  .btn-color-success {
    background-color: #6BAF88;
    color: #fff !important;
    font-weight: bold;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 0.375rem;
    transition: background-color 0.3s ease, transform 0.2s ease;
    text-decoration: none !important;
    display: inline-block;
  }

  .btn-color-success:hover,
  .btn-color-success:focus {
    background-color: #599F76;
    color: #fff !important;
    transform: scale(1.02);
    text-decoration: none;
  }

  .btn-color-success:active {
    background-color: #4C8964;
    transform: scale(0.98);
  }


  /* ============================
     Knapp: "Kommer inte" (röd)
     ============================ */
  .btn-color-kan-ej {
    background-color: #C94A4A;
    color: #fff !important;
    font-weight: bold;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 0.375rem;
    transition: background-color 0.3s ease, transform 0.2s ease;
    text-decoration: none !important;
    display: inline-block;
  }

  .btn-color-kan-ej:hover,
  .btn-color-kan-ej:focus {
    background-color: #A63E3E;
    color: #fff !important;
    transform: scale(1.02);
    text-decoration: none;
  }

  .btn-color-kan-ej:active {
    background-color: #8B3232;
    transform: scale(0.98);
  }


  /* ============================
     Flagglänkar – deltagande
     ============================ */
  .flag-deltar-andrad a {
    background-color: #f2b135;
    color: #fff;
    font-weight: bold;
    padding: 0.5rem 1.2rem;
    border-radius: 0.375rem;
    display: inline-block;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .flag-deltar-andrad a:hover {
    background-color: #dba32f;
    transform: scale(1.02);
  }

  .flag-deltar-andrad.action-unflag a {
    background-color: #50b882;
  }

  .flag-deltar-andrad.action-unflag a:hover {
    background-color: #3fa06e;
  }


  /* ============================
     Flagglänkar – avanmäld
     ============================ */
  .flag-delta-ej-andrad a {
    background-color: #50b882;
    color: #fff;
    font-weight: bold;
    padding: 0.5rem 1.2rem;
    border-radius: 0.375rem;
    display: inline-block;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .flag-delta-ej-andrad a:hover {
    background-color: #3fa06e;
    transform: scale(1.02);
  }

  .flag-delta-ej-andrad.action-unflag a {
    background-color: #f2b135;
  }

  .flag-delta-ej-andrad.action-unflag a:hover {
    background-color: #dba32f;
  }


  /* ============================
     Statuspunkt – cirkelindikator
     ============================ */
  .status-dot {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .bg-success-custom {
    background-color: #50b882;
  }

  .bg-danger-custom {
    background-color: #f26c63;
  }

  .bg-neutral-custom {
    background-color: #E8C76A;
  }

  .text-success-custom {
    color: #50b882;
  }

  .text-danger-custom {
    color: #f26c63;
  }

  .text-neutral-custom {
    color: #E8C76A;
  }


  /* ============================
