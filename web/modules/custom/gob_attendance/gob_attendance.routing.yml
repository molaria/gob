gob_attendance.set:
  path: '/anmalan/{node}/{answer}'
  defaults:
    _controller: '\Drupal\gob_attendance\Controller\AttendanceController::set'
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'
    answer: 'ja|nej'
  options:
    parameters:
      node:
        type: entity:node
