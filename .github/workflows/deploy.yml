name: Deploy

# Deploys code and config to production on every push to main. Never
# touches the production database, web/sites/default/files/ or
# settings.php - those are gitignored on the server and git pull
# cannot see them. See DEPLOY.md for the full picture.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            vendor/bin/drush deploy -y
            vendor/bin/drush cache:rebuild
