name: Deploy

# Deploys the pushed commit to production on every push to main. All logic
# lives in drift/deploy.sh, read straight from the commit being deployed:
# a safety gate that stops before touching anything if the server has
# changes that are not in git, then composer install, drush deploy and a
# health check. See DEPLOY.md.
#
# Commits made by the server itself (drift/efter-uppdatering.sh) carry
# [skip ci], so they never trigger this workflow.
on:
  push:
    branches:
      - main

# Never two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # deploy.sh may wait up to 15 minutes for a running server update.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            target="${{ github.sha }}"
            git fetch --quiet origin
            script="$(mktemp)"
            trap 'rm -f "$script"' EXIT
            git show "$target:drift/deploy.sh" > "$script"
            bash "$script" "$target"
